name: Candidate Detector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-detector:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run candidate detector
        run: python scripts/candidate_detector.py
