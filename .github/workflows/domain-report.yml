name: Domain Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-report:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate domain report
        run: python scripts/domain_report.py
