name: Find OSINT Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find source URLs
        run: python scripts/find_sources.py

      - name: Save sources.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data/sources.json
          git commit -m "Update OSINT source registry" || echo "No changes to commit"
          git push
