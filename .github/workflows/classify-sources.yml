name: Classify OSINT Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify sources
        run: python scripts/classify_sources.py
