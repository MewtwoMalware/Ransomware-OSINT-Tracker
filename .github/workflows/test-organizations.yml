name: Test Organization Registry

on:
  workflow_dispatch:

jobs:
  test-organizations:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run organization tests
        run: python tests/test_organizations.py
