name: Test Victim Aliases

on:
  workflow_dispatch:

jobs:
  test-aliases:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run alias tests
        run: python tests/test_aliases.py
